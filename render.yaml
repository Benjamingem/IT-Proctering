services:
  - type: web
    name: ben-infotech-workforce
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/activity-monitor.sqlite
    disk:
      name: workforce-data
      mountPath: /var/data
      sizeGB: 1
